<svg xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" viewBox="0 0 620 380" role="img" aria-labelledby="mapT">
<title id="mapT">생태 탐구 지도: 새싹에서 출발해 과제 1 주제 정하기, 과제 2 탐구·기록, 과제 3 보고서·성찰 정거장을 지나 큰 나무까지 가는 그림</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eefbe0"/><stop offset="1" stop-color="#f7fbef"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7e8a0"/><stop offset="1" stop-color="#a9d67a"/></linearGradient>
</defs>
<rect x="10" y="10" width="600" height="360" rx="26" fill="url(#sky)" stroke="#c6dfa6" stroke-width="3"/>
<!-- 해와 먼 산 -->
<circle cx="548" cy="64" r="26" fill="#fde68a"/><circle cx="548" cy="64" r="18" fill="#fcd34d"/>
<path d="M18 150 C 90 104, 150 112, 210 140 C 270 100, 340 96, 420 132 C 480 108, 540 110, 602 138 L602 362 L18 362 Z" fill="url(#hill)" opacity=".55"/>
<!-- 밭(장단콩·벼) 줄무늬 -->
<g opacity=".7"><path d="M400 300 L600 262 L600 360 L430 360 Z" fill="#e7f3c9"/>
<g stroke="#b9d98a" stroke-width="3" stroke-linecap="round"><line x1="440" y1="352" x2="596" y2="276"/><line x1="470" y1="356" x2="597" y2="296"/><line x1="505" y1="358" x2="598" y2="316"/><line x1="540" y1="358" x2="598" y2="334"/></g></g>
<!-- 하천 -->
<path d="M18 238 C 90 222, 140 260, 210 252 S 330 214, 380 236 S 470 290, 602 250" stroke="#7dd3fc" stroke-width="18" fill="none" stroke-linecap="round" opacity=".75"/>
<path d="M40 236 C 90 226, 130 254, 190 250" stroke="#e0f2fe" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M420 252 C 460 270, 500 276, 560 262" stroke="#e0f2fe" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- 작은 나무들 -->
<g fill="#65a30d"><circle cx="92" cy="128" r="12"/><circle cx="110" cy="136" r="10"/><circle cx="350" cy="122" r="11"/><circle cx="470" cy="150" r="10"/><circle cx="80" cy="330" r="11"/><circle cx="98" cy="338" r="8"/></g>
<g fill="#86c95a"><circle cx="88" cy="124" r="6"/><circle cx="346" cy="118" r="5"/></g>
<!-- 새 -->
<g fill="none" stroke="#3f6212" stroke-width="2.6" stroke-linecap="round"><path d="M250 58 q8 -8 16 0 q8 -8 16 0"/><path d="M300 82 q6 -6 12 0 q6 -6 12 0"/><path d="M410 46 q7 -7 14 0 q7 -7 14 0"/></g>
<!-- 탐구 길 -->
<path d="M70 200 C 110 196, 120 150, 170 146 S 250 196, 300 196 S 380 140, 430 132 S 520 170, 540 196" fill="none" stroke="#4d7c0f" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 12"/>
<!-- 출발: 새싹 -->
<g transform="translate(64 206)">
  <ellipse cx="0" cy="12" rx="22" ry="7" fill="#a16207" opacity=".35"/>
  <path d="M0 12 L0 -6" stroke="#4d7c0f" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 -4 C -14 -6, -18 -18, -16 -24 C -6 -24, 0 -16, 0 -4 Z" fill="#84cc16"/>
  <path d="M0 -8 C 12 -10, 18 -22, 16 -30 C 4 -30, -1 -20, 0 -8 Z" fill="#65a30d"/>
  <text x="0" y="40" text-anchor="middle" font-size="15" font-weight="800" fill="#3f6212">출발</text>
</g>
<!-- 정거장 1: 주제 정하기 -->
<g transform="translate(170 146)">
  <circle r="27" fill="#ffffff" stroke="#84cc16" stroke-width="5" stroke-dasharray="7 5"/>
  <text y="9" text-anchor="middle" font-size="26">🌱</text>
  <rect x="-54" y="34" width="108" height="42" rx="12" fill="#4d7c0f"/>
  <text y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#ecfccb">과제 1</text>
  <text y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">주제 정하기</text>
</g>
<!-- 정거장 2: 탐구·기록 -->
<g transform="translate(300 196)">
  <circle r="27" fill="#ffffff" stroke="#14b8a6" stroke-width="5" stroke-dasharray="7 5"/>
  <text y="9" text-anchor="middle" font-size="26">🔍</text>
  <rect x="-54" y="34" width="108" height="42" rx="12" fill="#0f766e"/>
  <text y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#ccfbf1">과제 2</text>
  <text y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">탐구·기록</text>
</g>
<!-- 정거장 3: 보고서·성찰 -->
<g transform="translate(430 132)">
  <circle r="27" fill="#ffffff" stroke="#16a34a" stroke-width="5" stroke-dasharray="7 5"/>
  <text y="9" text-anchor="middle" font-size="26">🌳</text>
  <rect x="-58" y="34" width="116" height="42" rx="12" fill="#166534"/>
  <text y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#dcfce7">과제 3</text>
  <text y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">보고서·성찰</text>
</g>
<!-- 도착: 큰 나무 -->
<g transform="translate(550 214)">
  <rect x="-6" y="-6" width="12" height="34" rx="4" fill="#92400e"/>
  <circle cx="0" cy="-30" r="30" fill="#16a34a"/>
  <circle cx="-18" cy="-16" r="18" fill="#22c55e"/>
  <circle cx="18" cy="-18" r="18" fill="#15803d"/>
  <circle cx="-8" cy="-40" r="10" fill="#4ade80" opacity=".8"/>
  <circle cx="10" cy="-24" r="3.5" fill="#ef4444"/><circle cx="-14" cy="-28" r="3.5" fill="#ef4444"/>
</g>
<!-- 말풍선 -->
<g transform="translate(46 54)">
  <rect width="170" height="52" rx="16" fill="#ffffff" stroke="#c6dfa6" stroke-width="2"/>
  <path d="M28 52 L22 68 L44 52 Z" fill="#ffffff" stroke="#c6dfa6" stroke-width="2" stroke-linejoin="round"/>
  <rect x="24" y="48" width="22" height="6" fill="#ffffff"/>
  <text x="85" y="23" text-anchor="middle" font-size="13" font-weight="800" fill="#3f6212">우리 주변 자연에서</text>
  <text x="85" y="41" text-anchor="middle" font-size="13" font-weight="800" fill="#3f6212">질문 하나 찾기! 🐦</text>
</g>
<text x="590" y="352" text-anchor="end" font-size="12" font-weight="700" fill="#4d7c0f" opacity=".8">🌱 기본 · 🌳 심화</text>
</svg>
